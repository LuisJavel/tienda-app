<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>StockFlow Mobile</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <audio id="scanSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3" type="audio/mp3">
  </audio>
  <audio id="errorSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3" type="audio/mp3">
  </audio>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-glass: rgba(255, 255, 255, 0.05);
      --accent-red: #ff4757;
      --accent-red-glow: rgba(255, 71, 87, 0.4);
      --accent-cyan: #00d9ff;
      --accent-cyan-glow: rgba(0, 217, 255, 0.3);
      --accent-green: #2ed573;
      --accent-green-glow: rgba(46, 213, 115, 0.3);
      --accent-amber: #ffa502;
      --accent-amber-glow: rgba(255, 165, 2, 0.3);
      --accent-purple: #a855f7;
      --accent-purple-glow: rgba(168, 85, 247, 0.3);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-muted: rgba(255, 255, 255, 0.35);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(255, 255, 255, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      padding: 12px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 400px;
      background: radial-gradient(ellipse at 50% -100px, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      animation: fadeSlideDown 0.6s ease-out;
    }

    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, #6366f1 50%, var(--accent-purple) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 2rem;
      box-shadow: 
        0 8px 32px rgba(0, 217, 255, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      animation: logoFloat 3s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      margin-top: 12px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .resumen-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      animation: fadeSlideUp 0.5s ease-out 0.1s both;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .resumen-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(46, 213, 115, 0.5), transparent);
    }

    .resumen-card.green::before {
      background: linear-gradient(90deg, transparent, rgba(46, 213, 115, 0.5), transparent);
    }

    .resumen-card.blue::before {
      background: linear-gradient(90deg, transparent, rgba(0, 217, 255, 0.5), transparent);
    }

    .resumen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .resumen-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    .resumen-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .resumen-icon.green {
      background: rgba(46, 213, 115, 0.15);
    }

    .resumen-total {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--accent-green);
      text-shadow: 0 0 30px var(--accent-green-glow);
    }

    .resumen-meta {
      display: flex;
      gap: 16px;
      margin-top: 12px;
    }

    .resumen-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .resumen-stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .resumen-stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-limpiar {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid rgba(255, 71, 87, 0.2);
      border-radius: 10px;
      padding: 8px 14px;
      color: var(--accent-red);
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-limpiar:active {
      background: rgba(255, 71, 87, 0.2);
      transform: scale(0.96);
    }

    .mode-selector {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .mode-btn {
      border: none;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .mode-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .mode-btn:active {
      transform: scale(0.98);
    }

    .mode-btn .icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      position: relative;
      z-index: 1;
    }

    .mode-btn .label {
      position: relative;
      z-index: 1;
      flex: 1;
      text-align: left;
    }

    .mode-btn .badge {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.15);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
    }

    .venta-btn {
      background: linear-gradient(135deg, rgba(255, 71, 87, 0.15) 0%, rgba(255, 71, 87, 0.05) 100%);
      border: 1px solid rgba(255, 71, 87, 0.2);
    }

    .venta-btn .icon { background: rgba(255, 71, 87, 0.2); }
    .venta-btn:hover { border-color: rgba(255, 71, 87, 0.4); }
    .venta-btn.active {
      background: linear-gradient(135deg, var(--accent-red) 0%, #e63946 100%);
      border-color: transparent;
      box-shadow: 0 8px 24px var(--accent-red-glow);
    }

    .carrito-btn {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.15) 0%, rgba(0, 217, 255, 0.05) 100%);
      border: 1px solid rgba(0, 217, 255, 0.2);
    }

    .carrito-btn .icon { background: rgba(0, 217, 255, 0.2); }
    .carrito-btn:hover { border-color: rgba(0, 217, 255, 0.4); }
    .carrito-btn.active {
      background: linear-gradient(135deg, var(--accent-cyan) 0%, #00b4d8 100%);
      border-color: transparent;
      box-shadow: 0 8px 24px var(--accent-cyan-glow);
    }

    .recarga-btn {
      background: linear-gradient(135deg, rgba(46, 213, 115, 0.15) 0%, rgba(46, 213, 115, 0.05) 100%);
      border: 1px solid rgba(46, 213, 115, 0.2);
    }

    .recarga-btn .icon { background: rgba(46, 213, 115, 0.2); }
    .recarga-btn:hover { border-color: rgba(46, 213, 115, 0.4); }
    .recarga-btn.active {
      background: linear-gradient(135deg, var(--accent-green) 0%, #25a95d 100%);
      border-color: transparent;
      box-shadow: 0 8px 24px var(--accent-green-glow);
    }

    .agregar-btn {
      background: linear-gradient(135deg, rgba(255, 165, 2, 0.15) 0%, rgba(255, 165, 2, 0.05) 100%);
      border: 1px solid rgba(255, 165, 2, 0.2);
    }

    .agregar-btn .icon { background: rgba(255, 165, 2, 0.2); }
    .agregar-btn:hover { border-color: rgba(255, 165, 2, 0.4); }
    .agregar-btn.active {
      background: linear-gradient(135deg, var(--accent-amber) 0%, #e69500 100%);
      border-color: transparent;
      box-shadow: 0 8px 24px var(--accent-amber-glow);
    }

    .consulta-btn {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.15) 0%, rgba(168, 85, 247, 0.05) 100%);
      border: 1px solid rgba(168, 85, 247, 0.2);
    }

    .consulta-btn .icon { background: rgba(168, 85, 247, 0.2); }
    .consulta-btn:hover { border-color: rgba(168, 85, 247, 0.4); }
    .consulta-btn.active {
      background: linear-gradient(135deg, var(--accent-purple) 0%, #9333ea 100%);
      border-color: transparent;
      box-shadow: 0 8px 24px var(--accent-purple-glow);
    }

    .scanner-card {
      margin-top: 16px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .scanner-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }

    .scanner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .scanner-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 600;
    }

    .scanner-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .btn-stop-camera {
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: var(--accent-red);
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-stop-camera:active {
      background: rgba(255, 71, 87, 0.25);
      transform: scale(0.96);
    }

    #startCameraBtn {
      width: 100%;
      padding: 48px 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.1) 100%);
      border: 2px dashed rgba(99, 102, 241, 0.3);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #startCameraBtn:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.3) 0%, rgba(168, 85, 247, 0.2) 100%);
      border-color: rgba(99, 102, 241, 0.5);
    }

    #startCameraBtn .icon-large {
      font-size: 2.5rem;
      opacity: 0.8;
    }

    #reader {
      width: 100%;
      height: 260px;
      border-radius: 20px;
      background: #000;
      display: none;
      overflow: hidden;
      position: relative;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 20px;
    }

    #reader::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 3px solid rgba(0, 217, 255, 0.5);
      border-radius: 20px;
      pointer-events: none;
      animation: scanLine 2s linear infinite;
    }

    @keyframes scanLine {
      0% { border-color: rgba(0, 217, 255, 0.8); }
      50% { border-color: rgba(168, 85, 247, 0.8); }
      100% { border-color: rgba(0, 217, 255, 0.8); }
    }

    .status {
      margin-top: 14px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .result {
      margin-top: 16px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.5;
      transition: all 0.3s ease;
    }

    .result.success {
      border-color: rgba(46, 213, 115, 0.3);
      background: linear-gradient(135deg, rgba(46, 213, 115, 0.1) 0%, rgba(46, 213, 115, 0.03) 100%);
    }

    .result.error {
      border-color: rgba(255, 71, 87, 0.3);
      background: linear-gradient(135deg, rgba(255, 71, 87, 0.1) 0%, rgba(255, 71, 87, 0.03) 100%);
    }

    .result-product {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .precio-box {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent-green);
      text-shadow: 0 0 30px var(--accent-green-glow);
      margin-top: 8px;
    }

    .stock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 10px;
    }

    .stock-badge.ok {
      background: rgba(46, 213, 115, 0.15);
      color: var(--accent-green);
    }

    .stock-badge.low {
      background: rgba(255, 165, 2, 0.15);
      color: var(--accent-amber);
    }

    .stock-badge.out {
      background: rgba(255, 71, 87, 0.15);
      color: var(--accent-red);
    }

    .form-producto {
      margin-top: 16px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 24px;
      display: none;
    }

    .form-producto h3 {
      text-align: center;
      margin-bottom: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .codigo-box {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.1) 100%);
      border: 1px solid rgba(99, 102, 241, 0.2);
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      margin-bottom: 18px;
      font-size: 0.95rem;
    }

    .codigo-box span {
      color: var(--accent-cyan);
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.03);
      color: white;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      background: rgba(0, 217, 255, 0.05);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .save-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, #6366f1 100%);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(0, 217, 255, 0.2);
    }

    .save-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(0, 217, 255, 0.2);
    }

    .log {
      margin-top: 16px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 20px;
    }

    .log h3 {
      margin-bottom: 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .log-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .log-item small {
      display: block;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-size: 0.75rem;
    }

    .log-item .action {
      font-weight: 500;
    }

    .historial-section {
      margin-top: 16px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 20px;
    }

    .historial-section h3 {
      margin-bottom: 14px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .historial-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }

    .historial-item:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .historial-item .fecha {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .historial-item .producto {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .historial-item .detalle {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .historial-item .total-venta {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--accent-green);
    }

    .vaciar-btn {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid rgba(255, 71, 87, 0.2);
      color: var(--accent-red);
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .vaciar-btn:active {
      background: rgba(255, 71, 87, 0.2);
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal.active {
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: 28px;
      padding: 28px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      animation: scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-content h3 {
      margin-bottom: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .modal-content input {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: 2px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-size: 1.5rem;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;

    .modal-content input:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }

    .modal-info {
      margin: 16px 0;
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .modal-info strong {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      color: white;
      margin-bottom: 4px;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn:active {
      transform: scale(0.96);
    }

    .modal-btn.confirm {
      background: linear-gradient(135deg, var(--accent-cyan) 0%, #6366f1 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(0, 217, 255, 0.25);
    }

    .modal-btn.cancelar {
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid rgba(255, 71, 87, 0.2);
      color: var(--accent-red);
    }

    .carrito-resumen {
      text-align: left;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .carrito-resumen::-webkit-scrollbar {
      width: 4px;
    }

    .carrito-resumen::-webkit-scrollbar-track {
      background: transparent;
    }

    .carrito-resumen::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .carrito-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .carrito-item-name {
      font-weight: 600;
      text-align: left;
      flex: 1;
      font-size: 0.9rem;
    }

    .carrito-item-cant {
      background: var(--accent-cyan);
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      margin: 0 10px;
    }

    .carrito-item-precio {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--accent-green);
      font-size: 0.9rem;
    }

    .carrito-item-remove {
      background: rgba(255, 71, 87, 0.15);
      color: var(--accent-red);
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 0.75rem;
      margin-left: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .carrito-item-remove:active {
      background: rgba(255, 71, 87, 0.3);
    }

    .carrito-total {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin: 16px 0;
      padding: 16px;
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.1) 0%, rgba(99, 102, 241, 0.1) 100%);
      border: 1px solid rgba(0, 217, 255, 0.2);
      border-radius: 16px;
    }

    .cobrar-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-green) 0%, #25a95d 100%);
      color: white;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--accent-green-glow);
      transition: all 0.25s ease;
    }

    .cobrar-btn:active {
      transform: scale(0.98);
    }

    .carrito-vacio {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .empty-state {
      padding: 30px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    @media (max-width: 380px) {
      body { padding: 10px; }
      .resumen-total { font-size: 2rem; }
      .mode-btn { padding: 14px 16px; }
      .mode-btn .icon { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">📦</div>
    <h1>ANLUSOFT</h1>
    <p>Sistema móvil de inventario</p>
  </div>

  <div class="resumen-card green">
    <div class="resumen-header">

    <div class="resumen-total" id="totalVendido">$ 0.00</div>
    <div class="resumen-meta">
      <div class="resumen-stat">

        <span class="resumen-stat-label">Ventas</span>
      </div>
      <div class="resumen-stat">
        <span class="resumen-stat-value" id="fechaDia" style="font-size:0.9rem;opacity:0.7;"></span>

  <div class="mode-selector">

    <button id="btnCarrito" class="mode-btn carrito-btn">

    <button id="btnRecarga" class="mode-btn recarga-btn">

  </div>

  <div class="form-producto" id="formProducto">
    <h3>✨ Nuevo Producto</h3>
    <div class="codigo-box">Código: <span id="codigoEscaneado"></span></div>
    <div class="form-group">
      <label>Producto</label>
      <input type="text" id="nombreProducto" placeholder="Nombre del producto">
    </div>
    <div class="form-group">
      <label>Stock inicial</label>
      <input type="number" id="stockProducto" placeholder="Cantidad" min="1">
    </div>
    <div class="form-group">
      <label>Precio ($)</label>
      <input type="number" id="precioProducto" placeholder="0.00" step="0.01" min="0">
    </div>
    <button class="save-btn" onclick="guardarProducto()">💾 Guardar Producto</button>

    <div class="modal-info" id="modalInfoProducto"></div>
    <div class="modal-buttons">
      <button class="modal-btn cancelar" onclick="cerrarModalCantidad()">✕ Cancelar</button>
      <button class="modal-btn confirm" onclick="confirmarAccion()">✓ Aceptar</button>
    </div>
  </div>
</div>

<div class="modal" id="modalCobrar">
  <div class="modal-content">
    <h3>💵 Cobrar</h3>
    <div class="carrito-resumen" id="resumenCarrito"></div>
    <div class="carrito-total" id="totalCarrito">$ 0.00</div>
    <div class="modal-buttons">
      <button class="modal-btn cancelar" onclick="cerrarModalCobrar()">← Seguir</button>
      <button class="modal-btn confirm" onclick="procesarCobro()" style="background: linear-gradient(135deg, var(--accent-green) 0%, #25a95d 100%);">💵 Cobrar</button>
    </div>
  </div>

<script>
let currentMode = "venta";
let isScanning = false;
let lastScanTime = 0;
let codigoNuevoProducto = "";
let precioTemporal = 0;
let productoTemporal = "";
let ultimoCodigoEscaneado = "";
let modalAccion = "venta";
let carrito = [];
let html5QrCode = null;
let cameraActiva = false;

const COOLDOWN_TIME = 1500;
const URL_API = "https://script.google.com/macros/s/AKfycby2IgT3K_Wh8c2zlHL8ThrfLKJVilW7VHzV4tOZToD1h8oQoDyqPSNcH9jNQlTLk_TvFw/exec";

const scanSound = document.getElementById("scanSound");
const errorSound = document.getElementById("errorSound");
const btnVenta = document.getElementById("btnVenta");
const btnCarrito = document.getElementById("btnCarrito");
const btnRecarga = document.getElementById("btnRecarga");
const btnAgregar = document.getElementById("btnAgregar");
const btnConsulta = document.getElementById("btnConsulta");
const modoActual = document.getElementById("modoActual");
const status = document.getElementById("status");
const result = document.getElementById("result");
const logDiv = document.getElementById("log");
const formProducto = document.getElementById("formProducto");
const codigoEscaneado = document.getElementById("codigoEscaneado");
const btnStopCamera = document.getElementById("btnStopCamera");
const startCameraBtn = document.getElementById("startCameraBtn");
const readerDiv = document.getElementById("reader");

function initLocalStorage(){
  const hoy = new Date().toDateString();
  const data = JSON.parse(localStorage.getItem("stockflow_resumen") || "{}");
  if(data.fecha !== hoy){
    localStorage.setItem("stockflow_resumen", JSON.stringify({fecha: hoy, total: 0, cantidad: 0, ventas: []}));
  }
  actualizarResumen();
}

function guardarVentaLocal(nombre, precio, cantidad){
  const hoy = new Date().toDateString();
  const data = JSON.parse(localStorage.getItem("stockflow_resumen") || "{}");
  if(data.fecha !== hoy){
    data.fecha = hoy;
    data.total = 0;
    data.cantidad = 0;
    data.ventas = [];
  }
  data.total += precio * cantidad;
  data.cantidad += cantidad;
  data.ventas.unshift({
    hora: new Date().toLocaleTimeString(),
    nombre: nombre,
    cantidad: cantidad,
    precio: precio,
    total: precio * cantidad
  });
  if(data.ventas.length > 100) data.ventas = data.ventas.slice(0, 100);
  localStorage.setItem("stockflow_resumen", JSON.stringify(data));
  actualizarResumen();
}

function actualizarResumen(){
  const data = JSON.parse(localStorage.getItem("stockflow_resumen") || "{}") || {};
  document.getElementById("totalVendido").textContent = "$ " + (data.total || 0).toFixed(2);
  document.getElementById("totalItems").textContent = data.cantidad || 0;
  const fecha = new Date();
  document.getElementById("fechaDia").textContent = fecha.toLocaleDateString("es-ES", {weekday:"short", day:"numeric", month:"short"});
}

function limpiarResumen(){
  if(confirm("¿Limpiar resumen del día?\nEsto no afecta Google Sheets.")){
    const hoy = new Date().toDateString();
    localStorage.setItem("stockflow_resumen", JSON.stringify({fecha: hoy, total: 0, cantidad: 0, ventas: []}));
    carrito = [];
    actualizarResumen();
    result.innerHTML = '<span style="color:var(--accent-green);">✓ Resumen limpiado</span>';
    result.className = 'result success';
  }
}

function mostrarHistorial(){
  const data = JSON.parse(localStorage.getItem("stockflow_resumen") || "{}") || {};
  const ventas = data.ventas || [];
  if(ventas.length === 0){
    listaVentas.innerHTML = '<div class="empty-state"><div class="icon">📭</div>No hay ventas hoy</div>';
  } else {
    listaVentas.innerHTML = ventas.map(v => `
      <div class="historial-item">
        <div class="fecha">${v.hora}</div>
        <div class="producto">${v.nombre}</div>
        <div class="detalle">
          <span>x${v.cantidad} × $${v.precio.toFixed(2)}</span>
          <span class="total-venta">$${v.total.toFixed(2)}</span>
        </div>
      </div>
    `).join("");
  }
  historialSection.style.display = historialSection.style.display === "none" ? "block" : "none";
}

function toggleHistorial(){
  historialSection.style.display = "none";
}

function playScanSound(){
  scanSound.currentTime = 0;
  scanSound.play().catch(() => {});
}

function showErrorSound(){
  errorSound.currentTime = 0;
  errorSound.play().catch(() => {});
}

function resetButtons(){
  btnVenta.classList.remove("active");
  btnCarrito.classList.remove("active");
  btnRecarga.classList.remove("active");
  btnAgregar.classList.remove("active");
  btnConsulta.classList.remove("active");
}

btnVenta.onclick = () => {
  currentMode = "venta";
  resetButtons();
  btnVenta.classList.add("active");
  modoActual.innerHTML = "Modo: VENTA";
  formProducto.style.display = "none";
  historialSection.style.display = "none";
  result.className = 'result';
  result.innerHTML = '<span style="color:var(--text-muted);">Escanea un producto...</span>';
};

btnCarrito.onclick = () => {
  currentMode = "carrito";
  resetButtons();
  btnCarrito.classList.add("active");
  modoActual.innerHTML = "🛒 CARRITO";
  formProducto.style.display = "none";
  historialSection.style.display = "none";
  mostrarCarrito();
};

btnRecarga.onclick = () => {
  currentMode = "recarga";
  resetButtons();
  btnRecarga.classList.add("active");
  modoActual.innerHTML = "🟢 RECARGAR";
  formProducto.style.display = "none";
  historialSection.style.display = "none";
  result.className = 'result';
  result.innerHTML = '<span style="color:var(--text-muted);">Escanea un producto para recargar...</span>';
};

btnAgregar.onclick = () => {
  currentMode = "agregar";
  resetButtons();
  btnAgregar.classList.add("active");
  modoActual.innerHTML = "➕ AGREGAR";
  historialSection.style.display = "none";
  result.className = 'result';
  result.innerHTML = '<span style="color:var(--text-muted);">Escanea el código del nuevo producto...</span>';
};

btnConsulta.onclick = () => {
  currentMode = "consulta";
  resetButtons();
  btnConsulta.classList.add("active");
  modoActual.innerHTML = "💲 CONSULTAR";
  formProducto.style.display = "none";
  historialSection.style.display = "none";
  result.className = 'result';
  result.innerHTML = '<span style="color:var(--text-muted);">Escanea para consultar precio...</span>';
};

async function startCameraApp(){
  if(cameraActiva) return;
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: "environment" } 
    });
    stream.getTracks().forEach(track => track.stop());
    
    startCameraBtn.style.display = "none";
    readerDiv.style.display = "block";
    btnStopCamera.style.display = "block";
    cameraActiva = true;
    
    await iniciarEscaner();
  } catch(err){
    status.innerHTML = "❌ No se pudo acceder a la cámara";
    console.error(err);
  }
}

async function iniciarEscaner(){
  try {
    html5QrCode = new Html5Qrcode("reader");
    await html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 12,
        qrbox: { width: 280, height: 280 },
        aspectRatio: 1.0
      },
      function(decodedText){
        console.log("ESCANEADO:", decodedText);
        handleScan(decodedText);
      },
      function(errorMessage){
        // Silencioso
      }
    );
    status.innerHTML = "📷 Cámara activa";
  } catch(err){
    status.innerHTML = "❌ Error al iniciar cámara";
    console.error(err);
  }
}

async function stopCamera(){
  if(html5QrCode){
    try {
      await html5QrCode.stop();
      html5QrCode = null;
    } catch(e){
      console.log("Cámara ya detenida");
    }
  }
  cameraActiva = false;
  readerDiv.style.display = "none";
  btnStopCamera.style.display = "none";
  startCameraBtn.style.display = "flex";
  status.innerHTML = "Cámara cerrada";
}

function handleScan(codigo){
  if(isScanning) return;
  
  const now = Date.now();
  if((now - lastScanTime) < COOLDOWN_TIME) return;
  
  isScanning = true;
  lastScanTime = now;
  playScanSound();
  status.innerHTML = `✓ Código: ${codigo}`;
  ultimoCodigoEscaneado = codigo;

  if(currentMode === "consulta"){
    result.innerHTML = "Consultando...";
    result.className = 'result';
    $.ajax({
      url: URL_API,
      method: "POST",
      contentType: "text/plain; charset=utf-8",
      data: JSON.stringify({op: "consultaprecio", codigo: codigo}),
      success: function(res){
        if(!res.success){
          result.innerHTML = "❌ " + res.message;
          result.className = 'result error';
          showErrorSound();
          return;
        }
        const stock = res.stock ?? 0;
        let stockClass = 'ok';
        let stockIcon = '✓';
        if(stock == 0){
          stockClass = 'out';
          stockIcon = '🚨';
        } else if(stock < 5){
          stockClass = 'low';
          stockIcon = '⚠️';
        }
        result.className = 'result success';
        result.innerHTML = `
          <div class="result-product">${res.producto}</div>
          <div class="precio-box">$ ${res.precio}</div>
          <span class="stock-badge ${stockClass}">${stockIcon} Stock: ${stock}</span>
        `;
        if(stock == 0) showErrorSound();
        addToLog("CONSULTA: " + codigo);
      },
      complete: function(){
        setTimeout(() => { isScanning = false; }, 1200);
      }
    });
    return;
  }

  if(currentMode === "agregar"){
    codigoNuevoProducto = codigo;
    codigoEscaneado.innerHTML = codigo;
    formProducto.style.display = "block";
    result.className = 'result success';
    result.innerHTML = "✅ Código escaneado<br>Completa el formulario";
    setTimeout(() => { isScanning = false; }, 1200);
    return;
  }

  if(currentMode === "recarga"){
    result.innerHTML = "Consultando producto...";
    result.className = 'result';
    $.ajax({
      url: URL_API,
      method: "POST",
      contentType: "text/plain; charset=utf-8",
      data: JSON.stringify({op: "consultaprecio", codigo: codigo}),
      success: function(res){
        if(!res.success){
          result.innerHTML = "❌ " + res.message;
          result.className = 'result error';
          showErrorSound();
          isScanning = false;
          return;
        }
        productoTemporal = res.producto;
        precioTemporal = parseFloat(res.precio) || 0;
        modalAccion = "recarga";
        document.getElementById("modalTitulo").innerHTML = "🟢 Recargar Stock";
        modalInfoProducto.innerHTML = `<strong>${res.producto}</strong><br>Stock actual: ${res.stock}`;
        inputCantidad.value = 1;
        inputCantidad.min = 1;
        inputCantidad.max = 999;
        modalCantidad.classList.add("active");
        isScanning = false;
      },
      error: function(){
        result.innerHTML = "❌ Producto no encontrado";
        result.className = 'result error';
        showErrorSound();
        isScanning = false;
      }
    });
    return;
  }

  if(currentMode === "venta" || currentMode === "carrito"){
    result.innerHTML = "Consultando...";
    result.className = 'result';
    $.ajax({
      url: URL_API,
      method: "POST",
      contentType: "text/plain; charset=utf-8",
      data: JSON.stringify({op: "consultaprecio", codigo: codigo}),
      success: function(res){
        if(!res.success){
          result.innerHTML = "❌ " + res.message;
          result.className = 'result error';
          showErrorSound();
          isScanning = false;
          return;
        }
        precioTemporal = parseFloat(res.precio) || 0;
        productoTemporal = res.producto;
        const stock = res.stock ?? 0;
        
        if(stock === 0){
          result.className = 'result error';
          result.innerHTML = `❌ SIN STOCK<br><br>${res.producto}`;
          showErrorSound();
          isScanning = false;
          return;
        }
        
        modalAccion = currentMode === "carrito" ? "agregarCarrito" : "venta";
        document.getElementById("modalTitulo").innerHTML = currentMode === "carrito" ? "🛒 Agregar al carrito" : "🔢 Cantidad a vender";
        modalInfoProducto.innerHTML = `<strong>${res.producto}</strong><br>Precio: $ ${res.precio}<br>Stock: ${stock}`;
        inputCantidad.value = 1;
        inputCantidad.min = 1;
        inputCantidad.max = stock;
        modalCantidad.classList.add("active");
        isScanning = false;
      },
      error: function(){
        result.innerHTML = "❌ Producto no encontrado";
        result.className = 'result error';
        showErrorSound();
        isScanning = false;
      }
    });
  }
}

function cerrarModalCantidad(){
  modalCantidad.classList.remove("active");
  precioTemporal = 0;
  productoTemporal = "";
}

function confirmarAccion(){
  const cantidad = parseInt(inputCantidad.value) || 1;
  if(cantidad < 1){
    alert("Cantidad inválida");
    return;
  }
  cerrarModalCantidad();

  if(modalAccion === "venta"){
    procesarVenta(ultimoCodigoEscaneado, cantidad);
  } else if(modalAccion === "recarga"){
    procesarRecarga(ultimoCodigoEscaneado, cantidad);
  } else if(modalAccion === "agregarCarrito"){
    agregarAlCarrito(productoTemporal, precioTemporal, cantidad);
  }
}

function procesarVenta(codigo, cantidad){
  if(!codigo){
    result.innerHTML = "❌ Escanea el código primero";
    result.className = 'result error';
    return;
  }
  result.innerHTML = "Procesando...";
  $.ajax({
    url: URL_API,
    method: "POST",
    contentType: "text/plain; charset=utf-8",
    data: JSON.stringify({op: "registraventa", codigo: codigo, cantidad: cantidad}),
    success: function(res){
      const isError = !res.success;
      const stock = res.stock ?? 0;
      if(isError){
        result.className = 'result error';
        result.innerHTML = `
          <strong style="color:var(--accent-red)">❌ Error</strong>
          <br><br>${res.message}
          ${stock == 0 ? "<br><b style='color:var(--accent-red)'>🚨 SIN STOCK</b>" : ""}
        `;
        showErrorSound();
      } else {
        result.className = 'result success';
        result.innerHTML = `
          <strong style="color:var(--accent-green)">✅ Vendido</strong>
          <br><br>${res.message}
          ${stock == 0 ? "<br><b style='color:var(--accent-amber)'>⚠️ Último stock</b>" : ""}
        `;
        playScanSound();
        guardarVentaLocal(productoTemporal, precioTemporal, cantidad);
      }
      addToLog(`VENTA x${cantidad} - ${productoTemporal}`);
    },
    error: function(){
      result.innerHTML = "❌ Error de conexión";
      result.className = 'result error';
      showErrorSound();
    },
    complete: function(){
      setTimeout(() => { isScanning = false; }, 1200);
    }
  });
}

function procesarRecarga(codigo, cantidad){
  result.innerHTML = "Recargando...";
  $.ajax({
    url: URL_API,
    method: "POST",
    contentType: "text/plain; charset=utf-8",
    data: JSON.stringify({op: "recargavarios", codigo: codigo, cantidad: cantidad}),
    success: function(res){
      const isError = !res.success;
      if(isError){
        result.className = 'result error';
        result.innerHTML = `
          <strong style="color:var(--accent-red)">❌ Error</strong>
          <br><br>${res.message}
        `;
        showErrorSound();
      } else {
        result.className = 'result success';
        result.innerHTML = `
          <strong style="color:var(--accent-green)">✅ Recargado</strong>
          <br><br>${res.message}
        `;
        playScanSound();
      }
      addToLog(`RECARGA +${cantidad} - ${productoTemporal}`);
    },
    error: function(){
      result.innerHTML = "❌ Error al recargar";
      result.className = 'result error';
      showErrorSound();
    },
    complete: function(){
      setTimeout(() => { isScanning = false; }, 1200);
    }
  });
}

function agregarAlCarrito(nombre, precio, cantidad){
  const item = carrito.find(i => i.nombre === nombre);
  if(item){
    item.cantidad += cantidad;
  } else {
    carrito.push({nombre, precio, cantidad});
  }
  mostrarCarrito();
  result.className = 'result success';
  result.innerHTML = `✅ ${nombre} x${cantidad}<br>agregado al carrito`;
  addToLog(`AGREGADO x${cantidad} - ${nombre}`);
}

function mostrarCarrito(){
  if(carrito.length === 0){
    result.innerHTML = '<div class="empty-state"><div class="icon">🛒</div>Carrito vacío<br>Escanea productos para agregar</div>';
    return;
  }
  const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
  result.className = 'result';
  result.innerHTML = `
    <h3 style="margin-bottom:16px;font-family:'Space Grotesk',sans-serif;">🛒 Tu Carrito</h3>
    ${carrito.map((item, i) => `
      <div class="carrito-item" style="color:#111;">
        <span class="carrito-item-name">${item.nombre}</span>
        <span class="carrito-item-cant">${item.cantidad}</span>
        <span class="carrito-item-precio">$${(item.precio * item.cantidad).toFixed(2)}</span>
        <button class="carrito-item-remove" onclick="quitarDelCarrito(${i})">✕</button>
      </div>
    `).join("")}
    <div class="carrito-total" style="color:var(--accent-cyan);">
      Total: $${total.toFixed(2)}
    </div>
    <button onclick="mostrarModalCobrar()" style="width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--accent-green),#25a95d);color:white;font-size:1.1rem;font-weight:700;cursor:pointer;box-shadow:0 4px 16px var(--accent-green-glow);">
      💵 Cobrar $${total.toFixed(2)}
    </button>
  `;
}

function quitarDelCarrito(index){
  carrito.splice(index, 1);
  mostrarCarrito();
}

function mostrarModalCobrar(){
  if(carrito.length === 0) return;
  const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
  document.getElementById("resumenCarrito").innerHTML = carrito.map(item => `
    <div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--border-subtle);color:#fff;font-size:0.9rem;">
      <span>${item.nombre} x${item.cantidad}</span>
      <span style="font-weight:700;color:var(--accent-green);">$${(item.precio * item.cantidad).toFixed(2)}</span>
    </div>
  `).join("");
  document.getElementById("totalCarrito").textContent = "$ " + total.toFixed(2);
  modalCobrar.classList.add("active");
}

function cerrarModalCobrar(){
  modalCobrar.classList.remove("active");
}

function procesarCobro(){
  if(carrito.length === 0) return;
  
  const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
  
  let pendientes = carrito.length;
  
  carrito.forEach(item => {
    $.ajax({
      url: URL_API,
      method: "POST",
      contentType: "text/plain; charset=utf-8",
      data: JSON.stringify({op: "registraventa", codigo: ultimoCodigoEscaneado, cantidad: item.cantidad}),
      success: function(res){
        guardarVentaLocal(item.nombre, item.precio, item.cantidad);
        pendientes--;
        if(pendientes === 0){
          cerrarModalCobrar();
          result.className = 'result success';
          result.innerHTML = `✅ VENTA COMPLETADA<br><br><span style="font-size:2.5rem;font-weight:700;color:var(--accent-green);font-family:'Space Grotesk',sans-serif;">$${total.toFixed(2)}</span><br><br>¡Gracias!`;
          playScanSound();
          carrito = [];
          setTimeout(() => {
            currentMode = "venta";
            resetButtons();
            btnVenta.classList.add("active");
            modoActual.innerHTML = "Modo: VENTA";
            result.innerHTML = '<span style="color:var(--text-muted);">Esperando escaneo...</span>';
          }, 2500);
        }
      }
    });
  });
}

function guardarProducto(){
  const producto = document.getElementById("nombreProducto").value.trim();
  const stock = document.getElementById("stockProducto").value.trim();
  const precio = document.getElementById("precioProducto").value.trim();
  
  if(!producto || !stock || !precio){
    alert("Completa todos los campos");
    return;
  }
  
  result.innerHTML = "Guardando...";
  result.className = 'result';
  $.ajax({
    url: URL_API,
    method: "POST",
    contentType: "text/plain; charset=utf-8",
    data: JSON.stringify({
      op: "agregarproducto",
      codigo: codigoNuevoProducto,
      producto: producto,
      stock: stock,
      precio: precio
    }),
    success: function(res){
      if(res.success){
        result.className = 'result success';
        result.innerHTML = `<strong style="color:var(--accent-green)">✅ Producto agregado</strong><br><br>${res.message}`;
        formProducto.style.display = "none";
        document.getElementById("nombreProducto").value = "";
        document.getElementById("stockProducto").value = "";
        document.getElementById("precioProducto").value = "";
      } else {
        result.className = 'result error';
        result.innerHTML = `<strong style="color:var(--accent-red)">❌ Error</strong><br><br>${res.message}`;
      }
      addToLog("NUEVO: " + producto);
    },
    error: function(){
      result.innerHTML = "❌ Error al guardar";
      result.className = 'result error';
    }
  });
}

function addToLog(texto){
  const hora = new Date().toLocaleTimeString();
  logDiv.innerHTML = `<div class="log-item"><small>${hora}</small><span class="action">${texto}</span></div>` + logDiv.innerHTML;
  if(logDiv.children.length > 12) logDiv.removeChild(logDiv.lastChild);
}

window.onload = () => {
  initLocalStorage();
  console.log("StockFlow listo ✓");
};
</script>
</body>
