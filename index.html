<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>StockFlow Mobile</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <audio id="scanSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3" type="audio/mp3">
  </audio>
  <audio id="errorSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3" type="audio/mp3">
  </audio>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Poppins',sans-serif;background:linear-gradient(180deg,#0f172a,#1e3a8a,#2563eb);min-height:100vh;color:white;padding:15px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
    .container{width:100%;max-width:500px;margin:auto;}
    .header{text-align:center;margin-bottom:15px;}
    .logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;margin:auto;font-size:2rem;box-shadow:0 10px 25px rgba(0,0,0,.3);}
    .header h1{margin-top:10px;font-size:2rem;font-weight:700;}
    .header p{opacity:.7;font-size:.9rem;}
    .resumen-card{background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:18px;padding:15px;margin-bottom:12px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25);}
    .resumen-card h3{font-size:.9rem;opacity:.9;margin-bottom:5px;}
    .resumen-total{font-size:2rem;font-weight:700;}
    .resumen-items{font-size:1rem;margin-top:3px;opacity:.9;}
    .btn-limpiar{background:rgba(255,255,255,.2);border:none;border-radius:8px;padding:6px 14px;color:white;font-weight:600;cursor:pointer;margin-top:8px;}
    .btn-limpiar:active{background:rgba(255,255,255,.35);}
    .mode-selector{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
    .mode-btn{border:none;border-radius:16px;padding:15px;font-size:.95rem;font-weight:700;color:white;cursor:pointer;transition:.2s;box-shadow:0 6px 18px rgba(0,0,0,.2);}
    .mode-btn:active{transform:scale(.97);}
    .venta-btn{background:linear-gradient(135deg,#ef4444,#dc2626);}
    .carrito-btn{background:linear-gradient(135deg,#06b6d4,#0891b2);}
    .recarga-btn{background:linear-gradient(135deg,#22c55e,#16a34a);}
    .agregar-btn{background:linear-gradient(135deg,#f59e0b,#d97706);}
    .consulta-btn{background:linear-gradient(135deg,#8b5cf6,#6d28d9);}
    .active{outline:3px solid rgba(255,255,255,.35);}
    .scanner-card{margin-top:18px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:24px;padding:15px;border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 30px rgba(0,0,0,.2);}
    .scanner-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
    .scanner-title{font-size:1.1rem;font-weight:700;}
    .btn-stop-camera{background:#ef4444;color:white;border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.85rem;}
    .btn-stop-camera:active{background:#dc2626;}
    #startCameraBtn{width:100%;padding:35px 20px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;font-size:1.1rem;font-weight:700;cursor:pointer;text-align:center;border:none;}
    #reader{width:100%;height:250px;border-radius:18px;background:#000;display:none;}
    #reader video{width:100%!important;height:250px!important;object-fit:cover!important;border-radius:18px;}
    .status{margin-top:12px;text-align:center;font-size:.95rem;font-weight:600;}
    .result{margin-top:15px;background:rgba(255,255,255,.1);border-radius:20px;padding:18px;text-align:center;font-size:1rem;backdrop-filter:blur(10px);min-height:80px;line-height:1.5;}
    .precio-box{font-size:2.5rem;font-weight:700;margin-top:8px;color:#22c55e;}
    .form-producto{margin-top:15px;background:white;border-radius:22px;padding:18px;color:#111827;display:none;}
    .form-producto h3{text-align:center;margin-bottom:12px;color:#1e3a8a;}
    .codigo-box{background:#f3f4f6;padding:12px;border-radius:12px;text-align:center;font-weight:700;margin-bottom:12px;}
    .form-group{margin-bottom:12px;}
    .form-group label{display:block;margin-bottom:5px;font-weight:600;font-size:.95rem;}
    .form-group input{width:100%;padding:12px;border-radius:12px;border:2px solid #d1d5db;font-size:1rem;}
    .form-group input:focus{outline:none;border-color:#2563eb;}
    .save-btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;font-size:1rem;font-weight:700;cursor:pointer;}
    .log{margin-top:15px;background:rgba(255,255,255,.1);border-radius:22px;padding:15px;backdrop-filter:blur(10px);}
    .log h3{margin-bottom:10px;font-size:1rem;}
    .log-item{background:rgba(255,255,255,.07);border-radius:12px;padding:10px;margin-bottom:8px;font-size:.9rem;}
    .log-item small{display:block;opacity:.65;margin-bottom:3px;}
    .historial-section{margin-top:18px;background:rgba(255,255,255,.1);border-radius:22px;padding:18px;backdrop-filter:blur(10px);}
    .historial-section h3{margin-bottom:12px;text-align:center;font-size:1.1rem;}
    .historial-item{background:rgba(255,255,255,.07);border-radius:12px;padding:10px;margin-bottom:8px;}
    .historial-item .fecha{font-size:.8rem;opacity:.65;}
    .historial-item .producto{font-weight:600;margin-top:3px;}
    .historial-item .detalle{display:flex;justify-content:space-between;margin-top:5px;font-size:.9rem;}
    .historial-item .total-venta{color:#22c55e;font-weight:700;}
    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;z-index:1000;}
    .modal.active{display:flex;}
    .modal-content{background:white;color:#111827;border-radius:22px;padding:22px;width:90%;max-width:340px;text-align:center;}
    .modal-content h3{margin-bottom:12px;color:#1e3a8a;font-size:1.2rem;}
    .modal-content input{width:100%;padding:14px;border-radius:12px;border:2px solid #d1d5db;font-size:1.3rem;text-align:center;margin-bottom:12px;}
    .modal-info{margin-bottom:12px;color:#555;font-size:.95rem;}
    .modal-buttons{display:flex;gap:10px;}
    .modal-btn{flex:1;padding:12px;border:none;border-radius:12px;font-weight:700;font-size:1rem;cursor:pointer;}
    .modal-btn.confirm{background:#2563eb;color:white;}
    .modal-btn.cancelar{background:#ef4444;color:white;}
    .carrito-resumen{text-align:left;margin-bottom:15px;max-height:200px;overflow-y:auto;}
    .carrito-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#f3f4f6;border-radius:10px;margin-bottom:6px;}
    .carrito-item-name{font-weight:600;text-align:left;flex:1;font-size:.95rem;}
    .carrito-item-cant{background:#2563eb;color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.8rem;}
    .carrito-item-precio{font-weight:700;color:#22c55e;font-size:.95rem;}
    .carrito-item-remove{background:#ef4444;color:white;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:.75rem;}
    .carrito-total{font-size:1.6rem;font-weight:700;color:#1e3a8a;margin:12px 0;padding:12px;background:#e0e7ff;border-radius:12px;}
    .cobrar-btn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#22c55e,#16a34a);color:white;font-size:1.2rem;font-weight:700;cursor:pointer;}
    .vaciar-btn{background:#ef4444;color:white;border:none;border-radius:10px;padding:8px 16px;cursor:pointer;margin-top:10px;font-size:.9rem;}
    .carrito-vacio{text-align:center;padding:30px;color:#666;font-size:1.1rem;}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">📦</div>
    <h1>ANLUSOFT</h1>
    <p>Sistema móvil de inventario</p>
  </div>

  <div class="resumen-card">
    <h3>📊 Resumen del Día ($)</h3>
    <div class="resumen-total" id="totalVendido">$ 0.00</div>
    <div class="resumen-items" id="totalItems">0 ventas</div>
    <div id="fechaDia" style="font-size:.85rem;opacity:.7;margin-top:5px;"></div>
    <button class="btn-limpiar" onclick="limpiarResumen()">🗑️ Limpiar</button>
  </div>

  <div class="mode-selector">
    <button id="btnVenta" class="mode-btn venta-btn active">🔴 VENTA</button>
    <button id="btnCarrito" class="mode-btn carrito-btn">🛒 CARRITO</button>
    <button id="btnRecarga" class="mode-btn recarga-btn">🟢 RECARGAR</button>
    <button id="btnAgregar" class="mode-btn agregar-btn">➕ AGREGAR</button>
    <button id="btnConsulta" class="mode-btn consulta-btn">💲 CONSULTAR</button>
  </div>

  <div class="scanner-card">
    <div class="scanner-header">
      <div id="modoActual" class="scanner-title">Modo: 🔴 VENTA</div>
      <button id="btnStopCamera" class="btn-stop-camera" onclick="stopCamera()" style="display:none;">✕ Cerrar Cámara</button>
    </div>
    <div id="startCameraBtn" onclick="startCameraApp()">📷 Pulsa para activar cámara</div>
    <div id="reader"></div>
    <div class="status"><span id="status">Activa la cámara para escanear</span></div>
  </div>

  <div class="result" id="result">Escanea un producto...</div>

  <div class="form-producto" id="formProducto">
    <h3>➕ Nuevo Producto</h3>
    <div class="codigo-box">Código: <span id="codigoEscaneado"></span></div>
    <div class="form-group"><label>Producto</label><input type="text" id="nombreProducto" placeholder="Nombre del producto"></div>
    <div class="form-group"><label>Stock inicial</label><input type="number" id="stockProducto" placeholder="Cantidad"></div>
    <div class="form-group"><label>Precio ($)</label><input type="number" id="precioProducto" placeholder="0.00" step="0.01"></div>
    <button class="save-btn" onclick="guardarProducto()">💾 Guardar Producto</button>
  </div>

  <div class="log">
    <h3>📋 Actividad Reciente</h3>
    <div id="log"></div>
  </div>

  <div class="historial-section" id="historialSection" style="display:none;">
    <h3>📦 Ventas del Día</h3>
    <div id="listaVentas"></div>
    <button class="vaciar-btn" onclick="toggleHistorial()">✕ Cerrar</button>
  </div>
</div>

<div class="modal" id="modalCantidad">
  <div class="modal-content">
    <h3 id="modalTitulo">🔢 Cantidad</h3>
    <input type="number" id="inputCantidad" value="1" min="1" placeholder="1">
    <div class="modal-info" id="modalInfoProducto"></div>
    <div class="modal-buttons">
      <button class="modal-btn cancelar" onclick="cerrarModalCantidad()">✕ Cancelar</button>
      <button class="modal-btn confirm" onclick="confirmarAccion()">✓ Aceptar</button>
    </div>
  </div>
</div>

<div class="modal" id="modalCobrar">
  <div class="modal-content">
    <h3>💵 Cobrar</h3>
    <div class="carrito-resumen" id="resumenCarrito"></div>
    <div class="carrito-total" id="totalCarrito">$ 0.00</div>
    <div class="modal-buttons">
      <button class="modal-btn cancelar" onclick="cerrarModalCobrar()">← Seguir</button>
      <button class="modal-btn confirm" onclick="procesarCobro()" style="background:#22c55e;">💵 Cobrar</button>
    </div>
  </div>
</div>

<script>
let currentMode = "venta";
let isScanning = false;
let lastScanTime = 0;
let codigoNuevoProducto = "";
let precioTemporal = 0;
let productoTemporal = "";
let ultimoCodigoEscaneado = "";
let modalAccion = "venta";
let carrito = [];
let html5QrCode = null;
let cameraActiva = false;

const COOLDOWN_TIME = 1500;
const URL_API = "https://script.google.com/macros/s/AKfycby2IgT3K_Wh8c2zlHL8ThrfLKJVilW7VHzV4tOZToD1h8oQoDyqPSNcH9jNQlTLk_TvFw/exec";

const scanSound = document.getElementById("scanSound");
const errorSound = document.getElementById("errorSound");
const btnVenta = document.getElementById("btnVenta");
const btnCarrito = document.getElementById("btnCarrito");
const btnRecarga = document.getElementById("btnRecarga");
const btnAgregar = document.getElementById("btnAgregar");
const btnConsulta = document.getElementById("btnConsulta");
const modoActual = document.getElementById("modoActual");
const status = document.getElementById("status");
const result = document.getElementById("result");
const logDiv = document.getElementById("log");
const formProducto = document.getElementById("formProducto");
const codigoEscaneado = document.getElementById("codigoEscaneado");
const btnStopCamera = document.getElementById("btnStopCamera");
const startCameraBtn = document.getElementById("startCameraBtn");
const readerDiv = document.getElementById("reader");

function initLocalStorage(){
  const hoy = new Date().toDateString();
  const data = JSON.parse(localStorage.getItem("stockflow_resumen") || "{}");
  if(data.fecha !== hoy){
    localStorage.setItem("stockflow_resumen", JSON.stringify({fecha: hoy, total: 0, cantidad: 0, ventas: []}));
  }
  actualizarResumen();
}

function guardarVentaLocal(nombre, precio, cantidad){
  const hoy = new Date().toDateString();
  const data = JSON.parse(localStorage.getItem("stockflow_resumen") || "{}");
  if(data.fecha !== hoy){
    data.fecha = hoy;
    data.total = 0;
    data.cantidad = 0;
    data.ventas = [];
  }
  data.total += precio * cantidad;
  data.cantidad += cantidad;
  data.ventas.unshift({
    hora: new Date().toLocaleTimeString(),
    nombre: nombre,
    cantidad: cantidad,
    precio: precio,
    total: precio * cantidad
  });
  if(data.ventas.length > 100) data.ventas = data.ventas.slice(0, 100);
  localStorage.setItem("stockflow_resumen", JSON.stringify(data));
  actualizarResumen();
}

function actualizarResumen(){
  const data = JSON.parse(localStorage.getItem("stockflow_resumen") || "{}") || {};
  document.getElementById("totalVendido").textContent = "$ " + (data.total || 0).toFixed(2);
  document.getElementById("totalItems").textContent = (data.cantidad || 0) + " ventas";
  const fecha = new Date();
  document.getElementById("fechaDia").textContent = fecha.toLocaleDateString("es-ES", {weekday:"long", day:"numeric", month:"long"});
}

function limpiarResumen(){
  if(confirm("¿Limpiar resumen del día?\nEsto no afecta Google Sheets.")){
    const hoy = new Date().toDateString();
    localStorage.setItem("stockflow_resumen", JSON.stringify({fecha: hoy, total: 0, cantidad: 0, ventas: []}));
    carrito = [];
    actualizarResumen();
    result.innerHTML = "Resumen limpiado ✓";
  }
}

function mostrarHistorial(){
  const data = JSON.parse(localStorage.getItem("stockflow_resumen") || "{}") || {};
  const ventas = data.ventas || [];
  if(ventas.length === 0){
    listaVentas.innerHTML = "<div class='carrito-vacio'>No hay ventas hoy</div>";
  } else {
    listaVentas.innerHTML = ventas.map(v => `
      <div class="historial-item">
        <div class="fecha">${v.hora}</div>
        <div class="producto">${v.nombre}</div>
        <div class="detalle">
          <span>x${v.cantidad} × $${v.precio.toFixed(2)}</span>
          <span class="total-venta">$${v.total.toFixed(2)}</span>
        </div>
      </div>
    `).join("");
  }
  historialSection.style.display = historialSection.style.display === "none" ? "block" : "none";
}

function toggleHistorial(){
  historialSection.style.display = "none";
}

function playScanSound(){
  scanSound.currentTime = 0;
  scanSound.play().catch(() => {});
}

function showErrorSound(){
  errorSound.currentTime = 0;
  errorSound.play().catch(() => {});
}

function resetButtons(){
  btnVenta.classList.remove("active");
  btnCarrito.classList.remove("active");
  btnRecarga.classList.remove("active");
  btnAgregar.classList.remove("active");
  btnConsulta.classList.remove("active");
}

btnVenta.onclick = () => {
  currentMode = "venta";
  resetButtons();
  btnVenta.classList.add("active");
  modoActual.innerHTML = "Modo: 🔴 VENTA";
  formProducto.style.display = "none";
  historialSection.style.display = "none";
};

btnCarrito.onclick = () => {
  currentMode = "carrito";
  resetButtons();
  btnCarrito.classList.add("active");
  modoActual.innerHTML = "🛒 CARRITO";
  formProducto.style.display = "none";
  historialSection.style.display = "none";
  mostrarCarrito();
};

btnRecarga.onclick = () => {
  currentMode = "recarga";
  resetButtons();
  btnRecarga.classList.add("active");
  modoActual.innerHTML = "🟢 RECARGAR";
  formProducto.style.display = "none";
  historialSection.style.display = "none";
};

btnAgregar.onclick = () => {
  currentMode = "agregar";
  resetButtons();
  btnAgregar.classList.add("active");
  modoActual.innerHTML = "➕ AGREGAR";
  historialSection.style.display = "none";
};

btnConsulta.onclick = () => {
  currentMode = "consulta";
  resetButtons();
  btnConsulta.classList.add("active");
  modoActual.innerHTML = "💲 CONSULTAR";
  formProducto.style.display = "none";
  historialSection.style.display = "none";
};

async function startCameraApp(){
  if(cameraActiva) return;
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: "environment" } 
    });
    stream.getTracks().forEach(track => track.stop());
    
    startCameraBtn.style.display = "none";
    readerDiv.style.display = "block";
    btnStopCamera.style.display = "block";
    cameraActiva = true;
    
    await iniciarEscaner();
  } catch(err){
    status.innerHTML = "❌ No se pudo acceder a la cámara";
    console.error(err);
  }
}

async function iniciarEscaner(){
  try {
    html5QrCode = new Html5Qrcode("reader");
    await html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 12,
        qrbox: { width: 300, height: 300 },
        aspectRatio: 1.0
      },
      function(decodedText){
        console.log("ESCANEADO:", decodedText);
        handleScan(decodedText);
      },
      function(errorMessage){
        // Silencioso
      }
    );
    status.innerHTML = "📷 Cámara activa";
  } catch(err){
    status.innerHTML = "❌ Error al iniciar cámara";
    console.error(err);
  }
}

async function stopCamera(){
  if(html5QrCode){
    try {
      await html5QrCode.stop();
      html5QrCode = null;
    } catch(e){
      console.log("Cámara ya detenida");
    }
  }
  cameraActiva = false;
  readerDiv.style.display = "none";
  btnStopCamera.style.display = "none";
  startCameraBtn.style.display = "block";
  status.innerHTML = "Cámara cerrada";
}

function handleScan(codigo){
  if(isScanning) return;
  
  const now = Date.now();
  if((now - lastScanTime) < COOLDOWN_TIME) return;
  
  isScanning = true;
  lastScanTime = now;
  playScanSound();
  status.innerHTML = `Código: ${codigo}`;
  ultimoCodigoEscaneado = codigo;

  if(currentMode === "consulta"){
    result.innerHTML = "Consultando...";
    $.ajax({
      url: URL_API,
      method: "POST",
      contentType: "text/plain; charset=utf-8",
      data: JSON.stringify({op: "consultaprecio", codigo: codigo}),
      success: function(res){
        if(!res.success){
          result.innerHTML = "❌ " + res.message;
          showErrorSound();
          return;
        }
        const stock = res.stock ?? 0;
        result.innerHTML = `
          <strong>${res.producto}</strong>
          <div class="precio-box">$ ${res.precio}</div>
          <div style="margin-top:8px;font-size:1.1rem;color:${stock == 0 ? 'red' : '#22c55e'}">
            📦 Stock: ${stock}
          </div>
          ${stock == 0 ? "<div style='color:red;font-weight:700;margin-top:8px;'>🚨 SIN STOCK</div>" : ""}
        `;
        if(stock == 0) showErrorSound();
        addToLog("CONSULTA: " + codigo);
      },
      complete: function(){
        setTimeout(() => { isScanning = false; }, 1200);
      }
    });
    return;
  }

  if(currentMode === "agregar"){
    codigoNuevoProducto = codigo;
    codigoEscaneado.innerHTML = codigo;
    formProducto.style.display = "block";
    result.innerHTML = "✅ Código escaneado<br>Completa el formulario";
    setTimeout(() => { isScanning = false; }, 1200);
    return;
  }

  if(currentMode === "recarga"){
    result.innerHTML = "Consultando producto...";
    $.ajax({
      url: URL_API,
      method: "POST",
      contentType: "text/plain; charset=utf-8",
      data: JSON.stringify({op: "consultaprecio", codigo: codigo}),
      success: function(res){
        if(!res.success){
          result.innerHTML = "❌ " + res.message;
          showErrorSound();
          isScanning = false;
          return;
        }
        productoTemporal = res.producto;
        precioTemporal = parseFloat(res.precio) || 0;
        modalAccion = "recarga";
        document.getElementById("modalTitulo").innerHTML = "🟢 Recargar Stock";
        modalInfoProducto.innerHTML = `<strong>${res.producto}</strong><br>Stock actual: ${res.stock}`;
        inputCantidad.value = 1;
        inputCantidad.min = 1;
        inputCantidad.max = 999;
        modalCantidad.classList.add("active");
        isScanning = false;
      },
      error: function(){
        result.innerHTML = "❌ Producto no encontrado";
        showErrorSound();
        isScanning = false;
      }
    });
    return;
  }

  if(currentMode === "venta" || currentMode === "carrito"){
    result.innerHTML = "Consultando...";
    $.ajax({
      url: URL_API,
      method: "POST",
      contentType: "text/plain; charset=utf-8",
      data: JSON.stringify({op: "consultaprecio", codigo: codigo}),
      success: function(res){
        if(!res.success){
          result.innerHTML = "❌ " + res.message;
          showErrorSound();
          isScanning = false;
          return;
        }
        precioTemporal = parseFloat(res.precio) || 0;
        productoTemporal = res.producto;
        const stock = res.stock ?? 0;
        
        if(stock === 0){
          result.innerHTML = `❌ SIN STOCK<br><br>${res.producto}`;
          showErrorSound();
          isScanning = false;
          return;
        }
        
        modalAccion = currentMode === "carrito" ? "agregarCarrito" : "venta";
        document.getElementById("modalTitulo").innerHTML = currentMode === "carrito" ? "🛒 Agregar al carrito" : "🔢 Cantidad a vender";
        modalInfoProducto.innerHTML = `<strong>${res.producto}</strong><br>Precio: $ ${res.precio}<br>Stock: ${stock}`;
        inputCantidad.value = 1;
        inputCantidad.min = 1;
        inputCantidad.max = stock;
        modalCantidad.classList.add("active");
        isScanning = false;
      },
      error: function(){
        result.innerHTML = "❌ Producto no encontrado";
        showErrorSound();
        isScanning = false;
      }
    });
  }
}

function cerrarModalCantidad(){
  modalCantidad.classList.remove("active");
  precioTemporal = 0;
  productoTemporal = "";
}

function confirmarAccion(){
  const cantidad = parseInt(inputCantidad.value) || 1;
  if(cantidad < 1){
    alert("Cantidad inválida");
    return;
  }
  cerrarModalCantidad();

  if(modalAccion === "venta"){
    procesarVenta(ultimoCodigoEscaneado, cantidad);
  } else if(modalAccion === "recarga"){
    procesarRecarga(ultimoCodigoEscaneado, cantidad);
  } else if(modalAccion === "agregarCarrito"){
    agregarAlCarrito(productoTemporal, precioTemporal, cantidad);
  }
}

function procesarVenta(codigo, cantidad){
  if(!codigo){
    result.innerHTML = "❌ Escanea el código primero";
    return;
  }
  result.innerHTML = "Procesando...";
  $.ajax({
    url: URL_API,
    method: "POST",
    contentType: "text/plain; charset=utf-8",
    data: JSON.stringify({op: "registraventa", codigo: codigo, cantidad: cantidad}),
    success: function(res){
      const isError = !res.success;
      const stock = res.stock ?? 0;
      result.innerHTML = `
        <strong style="color:${isError ? 'red' : '#22c55e'}">
          ${res.success ? '✅ Vendido' : '❌ Error'}
        </strong>
        <br><br>${res.message}
        ${stock == 0 ? "<br><b style='color:red'>🚨 SIN STOCK</b>" : ""}
      `;
      if(!isError){
        guardarVentaLocal(productoTemporal, precioTemporal, cantidad);
        playScanSound();
      } else {
        showErrorSound();
      }
      addToLog(`VENTA x${cantidad} - ${productoTemporal}`);
    },
    error: function(){
      result.innerHTML = "❌ Error de conexión";
      showErrorSound();
    },
    complete: function(){
      setTimeout(() => { isScanning = false; }, 1200);
    }
  });
}

function procesarRecarga(codigo, cantidad){
  result.innerHTML = "Recargando...";
  $.ajax({
    url: URL_API,
    method: "POST",
    contentType: "text/plain; charset=utf-8",
    data: JSON.stringify({op: "recargavarios", codigo: codigo, cantidad: cantidad}),
    success: function(res){
      const isError = !res.success;
      result.innerHTML = `
        <strong style="color:${isError ? 'red' : '#22c55e'}">
          ${res.success ? '✅ Recargado' : '❌ Error'}
        </strong>
        <br><br>${res.message}
      `;
      if(isError) showErrorSound();
      addToLog(`RECARGA +${cantidad} - ${productoTemporal}`);
    },
    error: function(){
      result.innerHTML = "❌ Error al recargar";
      showErrorSound();
    },
    complete: function(){
      setTimeout(() => { isScanning = false; }, 1200);
    }
  });
}

function agregarAlCarrito(nombre, precio, cantidad){
  const item = carrito.find(i => i.nombre === nombre);
  if(item){
    item.cantidad += cantidad;
  } else {
    carrito.push({nombre, precio, cantidad});
  }
  mostrarCarrito();
  result.innerHTML = `✅ ${nombre} x${cantidad}<br>agregado al carrito`;
  addToLog(`AGREGADO x${cantidad} - ${nombre}`);
}

function mostrarCarrito(){
  if(carrito.length === 0){
    result.innerHTML = "🛒 Carrito vacío<br>Escanea productos para agregar";
    return;
  }
  const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
  result.innerHTML = `
    <h3 style="margin-bottom:12px;">🛒 Tu Carrito</h3>
    ${carrito.map((item, i) => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:#f3f4f6;border-radius:10px;margin-bottom:6px;color:#111;">
        <span style="font-weight:600;font-size:.9rem;">${item.nombre}</span>
        <span style="background:#2563eb;color:white;padding:3px 10px;border-radius:15px;font-size:.85rem;">x${item.cantidad}</span>
        <span style="font-weight:700;color:#22c55e;font-size:.9rem;">$${(item.precio * item.cantidad).toFixed(2)}</span>
        <button onclick="quitarDelCarrito(${i})" style="background:#ef4444;color:white;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:.7rem;">✕</button>
      </div>
    `).join("")}
    <div style="font-size:1.5rem;font-weight:700;color:#1e3a8a;margin-top:12px;padding:12px;background:#e0e7ff;border-radius:12px;">
      Total: $${total.toFixed(2)}
    </div>
    <button onclick="mostrarModalCobrar()" style="width:100%;padding:16px;margin-top:12px;border:none;border-radius:14px;background:linear-gradient(135deg,#22c55e,#16a34a);color:white;font-size:1.2rem;font-weight:700;cursor:pointer;">
      💵 Cobrar $${total.toFixed(2)}
    </button>
  `;
}

function quitarDelCarrito(index){
  carrito.splice(index, 1);
  mostrarCarrito();
}

function mostrarModalCobrar(){
  if(carrito.length === 0) return;
  const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
  document.getElementById("resumenCarrito").innerHTML = carrito.map(item => `
    <div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #ddd;color:#111;font-size:.95rem;">
      <span>${item.nombre} x${item.cantidad}</span>
      <span style="font-weight:700;color:#22c55e;">$${(item.precio * item.cantidad).toFixed(2)}</span>
    </div>
  `).join("");
  document.getElementById("totalCarrito").textContent = "$ " + total.toFixed(2);
  modalCobrar.classList.add("active");
}

function cerrarModalCobrar(){
  modalCobrar.classList.remove("active");
}

function procesarCobro(){
  if(carrito.length === 0) return;
  
  const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
  
  // Enviar cada producto al servidor
  let pendientes = carrito.length;
  
  carrito.forEach(item => {
    // Buscar código del producto (necesario para enviar a Google Sheets)
    // Por ahora usamos el último código escaneado para cada item
    $.ajax({
      url: URL_API,
      method: "POST",
      contentType: "text/plain; charset=utf-8",
      data: JSON.stringify({op: "registraventa", codigo: ultimoCodigoEscaneado, cantidad: item.cantidad}),
      success: function(res){
        guardarVentaLocal(item.nombre, item.precio, item.cantidad);
        pendientes--;
        if(pendientes === 0){
          cerrarModalCobrar();
          result.innerHTML = `✅ VENTA COMPLETADA<br><br><span style="font-size:2rem;font-weight:700;color:#22c55e;">$${total.toFixed(2)}</span><br><br>¡Gracias!`;
          playScanSound();
          carrito = [];
          setTimeout(() => {
            currentMode = "venta";
            resetButtons();
            btnVenta.classList.add("active");
            modoActual.innerHTML = "Modo: 🔴 VENTA";
            result.innerHTML = "Esperando escaneo...";
          }, 2500);
        }
      }
    });
  });
}

function guardarProducto(){
  const producto = document.getElementById("nombreProducto").value.trim();
  const stock = document.getElementById("stockProducto").value.trim();
  const precio = document.getElementById("precioProducto").value.trim();
  
  if(!producto || !stock || !precio){
    alert("Completa todos los campos");
    return;
  }
  
  result.innerHTML = "Guardando...";
  $.ajax({
    url: URL_API,
    method: "POST",
    contentType: "text/plain; charset=utf-8",
    data: JSON.stringify({
      op: "agregarproducto",
      codigo: codigoNuevoProducto,
      producto: producto,
      stock: stock,
      precio: precio
    }),
    success: function(res){
      result.innerHTML = `<strong style="color:${res.success ? '#22c55e' : 'red'}">${res.success ? '✅ Producto agregado' : '❌ Error'}</strong><br><br>${res.message}`;
      if(res.success){
        formProducto.style.display = "none";
        document.getElementById("nombreProducto").value = "";
        document.getElementById("stockProducto").value = "";
        document.getElementById("precioProducto").value = "";
      }
      addToLog("NUEVO: " + producto);
    },
    error: function(){
      result.innerHTML = "❌ Error al guardar";
    }
  });
}

function addToLog(texto){
  const hora = new Date().toLocaleTimeString();
  logDiv.innerHTML = `<div class="log-item"><small>${hora}</small>${texto}</div>` + logDiv.innerHTML;
  if(logDiv.children.length > 12) logDiv.removeChild(logDiv.lastChild);
}

window.onload = () => {
  initLocalStorage();
  console.log("StockFlow listo ✓");
};
</script>
